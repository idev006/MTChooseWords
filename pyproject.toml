[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt-choose-words"
version = "0.1.0"
description = "Thai worksheet word PDF generator"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "integration: reads real PDF/assets and exercises the full extraction boundary",
]

[tool.setuptools.packages.find]
include = ["app*"]
